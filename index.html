<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор Famibud переїхав</title>
<link rel="canonical" href="https://famibud.com.ua/calculator">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0;url=https://famibud.com.ua/calculator">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font-family:-apple-system,Segoe UI,Roboto,sans-serif;
       background:#16232C;color:#fff;text-align:center;padding:24px}
  a{color:#3DA0A7;font-size:18px}
</style>
</head>
<body>
  <div>
    <p style="font-size:22px;margin:0 0 8px">Калькулятор переїхав на сайт</p>
    <p style="opacity:.65;margin:0 0 24px">Тепер із цінами з каталогу й додаванням у кошик</p>
    <a href="https://famibud.com.ua/calculator">famibud.com.ua/calculator</a>
  </div>
  <script>
    // прибираємо старий офлайн-застосунок, інакше він показуватиме кеш
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()))
    }
    if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)))
    location.replace('https://famibud.com.ua/calculator')
  </script>
</body>
</html>
